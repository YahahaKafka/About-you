<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>About You — A Memory</title>
<style>
:root{--paper:#e8d8b7;--ink:#35291f;--cream:#f5ead5;--red:#9f3930}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0c0b0a;color:var(--cream);font-family:Georgia,"Times New Roman",serif}
.stage{position:relative;width:100%;height:100svh;min-height:520px;overflow:hidden;isolation:isolate;background:radial-gradient(ellipse at 25% 20%,#ffdc9a3d,transparent 34%),radial-gradient(ellipse at 78% 82%,#9d5c3140,transparent 35%),linear-gradient(135deg,#4c3a2b,#b39a72 48%,#3a2c22)}
.texture{position:absolute;inset:-10%;opacity:.28;pointer-events:none;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.3'/%3E%3C/svg%3E");mix-blend-mode:soft-light;animation:drift 20s linear infinite}
.light-leak{position:absolute;inset:-30%;z-index:1;pointer-events:none;background:linear-gradient(115deg,transparent 28%,#ffe3a51c 42%,#fff0ce38 48%,transparent 61%);transform:translateX(-65%) rotate(-8deg);animation:leak 12s ease-in-out infinite alternate}
.dust{position:absolute;inset:0;z-index:4;pointer-events:none;overflow:hidden}
.dust i{position:absolute;left:var(--x);top:110%;width:var(--s);height:var(--s);border-radius:50%;background:#ffe9bd;opacity:0;box-shadow:0 0 9px #ffe3b8;animation:float var(--d) linear var(--delay) infinite}
.tape{position:absolute;z-index:4;width:76px;height:22px;background:#e6d1a477;box-shadow:0 2px 5px #0002;backdrop-filter:blur(2px)}.tape.a{left:calc(50% - 155px);top:calc(48% - min(38vw,220px));transform:rotate(-18deg)}.tape.b{right:calc(50% - 158px);bottom:calc(52% - min(39vw,220px));transform:rotate(14deg)}
.stamp{position:absolute;z-index:4;right:8%;top:15%;width:72px;height:72px;border:1px solid #ead7b0a6;border-radius:50%;display:grid;place-items:center;text-align:center;color:#ead7b0a6;font:8px Arial;letter-spacing:.18em;transform:rotate(13deg);opacity:.0;transition:opacity 1s}.stamp.show{opacity:.8}
.spark{position:absolute;z-index:4;color:#f3dba8;font-size:22px;opacity:0;animation:twinkle 3s ease-in-out infinite}.spark.s1{left:13%;top:34%}.spark.s2{right:19%;bottom:32%;animation-delay:1s}.spark.s3{right:12%;top:55%;animation-delay:1.7s}
.top{position:absolute;top:22px;left:22px;right:22px;display:flex;justify-content:space-between;z-index:8;font:10px Arial,sans-serif;letter-spacing:.24em;color:#fff2dacc}
.card{position:absolute;z-index:2;left:50%;top:48%;width:min(66vw,360px);height:min(76vw,440px);max-height:62vh;padding:13px 13px 38px;background:linear-gradient(145deg,#f4e6ca,#d5be97);box-shadow:0 24px 70px #0007;transform:translate(-50%,-50%) rotate(-4deg);transition:transform 1.4s,opacity 1.2s}
.frame{height:100%;overflow:hidden;background:#5d4a39}.portrait{width:100%;height:100%;object-fit:cover;object-position:50% 42%;filter:sepia(.18) saturate(.78) contrast(.94);animation:zoom 37s ease-in-out forwards}
.caption{position:absolute;bottom:11px;left:0;right:0;text-align:center;color:#6d563c;font:italic 12px Georgia}
.card.right{transform:translate(-50%,-50%) rotate(3deg) translateX(3vw)}.card.zoom{transform:translate(-50%,-50%) rotate(-1deg) scale(1.05)}.card.fade{opacity:.25;transform:translate(-50%,-50%) rotate(2deg) scale(.94)}
.lyric{position:absolute;z-index:5;left:50%;top:50%;width:min(90vw,700px);transform:translate(-50%,-50%) scale(.97);text-align:center;color:#fff0d7;font-size:clamp(25px,5vw,48px);line-height:1.18;letter-spacing:-.025em;text-shadow:0 2px 22px #21170f99;opacity:0;transition:opacity .7s,transform 1s;pointer-events:none;padding:0 12px}
.lyric.show{opacity:1;transform:translate(-50%,-50%) scale(1)}.lyric small{display:block;margin-top:16px;font:9px Arial;letter-spacing:.28em;opacity:.72}
.note{position:absolute;z-index:4;font:italic clamp(13px,2vw,20px)/1.2 Georgia;color:#4d3a28;opacity:0;transition:opacity 1s,transform 1.3s;pointer-events:none}.note.left{left:7%;top:24%;transform:rotate(-9deg) translateY(10px)}.note.right{right:7%;bottom:25%;transform:rotate(7deg) translateY(10px)}.note.show{opacity:.86;transform:rotate(-5deg)}
.vinyl{position:absolute;z-index:3;width:clamp(125px,27vw,270px);aspect-ratio:1;border-radius:50%;background:repeating-radial-gradient(circle,#171716 0 2px,#252321 3px 5px,#0e0e0e 6px 8px);box-shadow:0 15px 40px #0008;opacity:0;transition:opacity 1.2s,transform 1.2s}
.vinyl:before{content:"";position:absolute;width:28%;height:28%;border-radius:50%;background:radial-gradient(circle,#54718a 0 20%,#a8a18a 22% 28%,#243849 30%);left:36%;top:36%;border:2px solid #d5c4a1}
.vinyl.left{left:-9%;top:18%;transform:scale(.8)}.vinyl.right{right:-10%;bottom:14%;transform:scale(.8)}.vinyl.show{opacity:.9;transform:scale(1);animation:spin 8s linear infinite}
.heart{position:absolute;z-index:4;inset:13% 8% 14%;width:84%;height:73%;opacity:0;transition:opacity .7s;pointer-events:none}.heart.show{opacity:.9}.heart path{fill:none;stroke:var(--red);stroke-width:2.2;stroke-linecap:round;stroke-dasharray:700;stroke-dashoffset:700}.heart.show path{animation:draw 2.4s ease forwards}
.flower{position:absolute;z-index:1;color:#ead4a7;opacity:0;font-size:clamp(26px,5vw,58px);transition:opacity 1s,transform 2s}.flower.one{top:16%;right:12%}.flower.two{bottom:14%;left:9%}.flower.show{opacity:.7;transform:rotate(12deg)}
.scribble{position:absolute;z-index:4;left:8%;bottom:20%;font:italic clamp(13px,2vw,20px) Georgia;color:#f1d9ad;opacity:0;transform:rotate(-11deg) translateY(8px);transition:opacity 1s,transform 1s;pointer-events:none}.scribble.show{opacity:.78;transform:rotate(-11deg) translateY(0)}
.progress{position:absolute;z-index:8;left:22px;right:22px;bottom:22px;display:flex;align-items:center;gap:12px;font:10px Arial;letter-spacing:.12em;color:#f0dfc2}.bar{height:1px;background:#ffffff4d;flex:1}.fill{height:100%;width:0;background:#f2e3c7}
.intro{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px;background:linear-gradient(#100e0b55,#100e0b77);transition:opacity .9s,visibility .9s}.intro.hide{opacity:0;visibility:hidden}
.eyebrow{font:9px Arial;letter-spacing:.35em;text-transform:uppercase;margin-bottom:18px;color:#e2cda8}h1{margin:0;font-weight:400;font-size:clamp(46px,10vw,90px);letter-spacing:-.045em}.subtitle{margin:14px 0 26px;font-style:italic;font-size:clamp(14px,2.8vw,18px);color:#e2d1b6}
button{border:1px solid #ead9bbbd;border-radius:999px;padding:13px 22px;color:#fff1d9;background:#1c17124a;font:11px Arial;letter-spacing:.08em;cursor:pointer}.foot{margin-top:22px;color:#d1bfa0;font:10px Arial;letter-spacing:.08em}
@keyframes spin{to{rotate:360deg}}@keyframes leak{to{transform:translateX(65%) rotate(-8deg)}}@keyframes float{0%{top:110%;opacity:0;transform:translateX(0) scale(.7)}15%{opacity:.6}80%{opacity:.35}100%{top:-10%;opacity:0;transform:translateX(var(--drift)) scale(1.3)}}@keyframes twinkle{0%,100%{opacity:0;transform:scale(.6) rotate(0)}50%{opacity:.8;transform:scale(1.15) rotate(20deg)}}@keyframes draw{to{stroke-dashoffset:0}}@keyframes zoom{0%{transform:scale(1.02)}35%{transform:scale(1.09) translate(-1%,1%)}70%{transform:scale(1.13) translate(1%,-1%)}100%{transform:scale(1.16)}}@keyframes drift{to{transform:translate(-2%,1%)}}
@media(max-width:600px){.card{width:68vw;height:82vw;max-height:55vh}.top{top:16px;left:16px;right:16px;font-size:8px}.progress{left:16px;right:16px;bottom:16px}}
</style>
</head>
<body>
<main class="stage">
<div class="texture"></div><div class="light-leak"></div><div class="dust" id="dust"></div><div class="tape a"></div><div class="tape b"></div><div class="stamp" id="stamp">POST<br>MEMORY<br>NO. 1975</div><div class="spark s1">✧</div><div class="spark s2">✦</div><div class="spark s3">✧</div><div class="scribble" id="scribble">if only time could stay here</div>
<div class="top"><span>THE 1975 / ABOUT YOU</span><span id="counter">00 / 37</span></div>
<div class="flower one" id="f1">✿</div><div class="flower two" id="f2">✿</div>
<div class="card" id="card"><div class="frame"><img class="portrait" src="foto1.jpg" alt="Foto kenangan"></div><div class="caption">a memory, kept close</div></div>
<div class="vinyl left" id="v1"></div><div class="vinyl right" id="v2"></div>
<svg class="heart" id="heart" viewBox="0 0 400 300" aria-hidden="true"><path d="M200 258 C168 226 52 155 48 91 C44 34 117 20 160 65 L200 105 L240 65 C283 20 356 34 352 91 C348 155 232 226 200 258 Z"/></svg>
<div class="note left" id="n1">some people<br>never really leave</div><div class="note right" id="n2">you still<br>cross my mind</div>
<div class="lyric" id="lyric"></div>
<div class="progress"><span id="clock">00:00</span><div class="bar"><div class="fill" id="fill"></div></div><span>00:37</span></div>
<section class="intro" id="intro"><div class="eyebrow">A MEMORY, KEPT CLOSE</div><h1>About You</h1><div class="subtitle">Some people never really leave.</div><button id="enter">Enter the memory →</button><div class="foot">ONE PHOTO · A THOUSAND MEMORIES</div></section>
<audio id="audio" src="song.mp3" preload="auto"></audio>
</main>
<script>
const scenes=[
 {at:0,text:"Wait and pretend",paper:"right",note:1,flowers:true},
 {at:10.03,text:"Hold on and hope<br><em>that we'll find our way back in the end</em>",paper:"zoom",vinyl:1,flowers:true},
 {at:16.55,text:"",paper:"right",note:2,vinyl:1},
 {at:19.47,text:"Do you think I have forgotten?",paper:"zoom",heart:true,vinyl:1},
 {at:24.35,text:"Do you think I have forgotten?",paper:"right",heart:true,vinyl:2},
 {at:29.29,text:"Do you think I have forgotten<br><em>about you?</em>",paper:"zoom",heart:true,vinyl:2},
 {at:33.5,text:"Some memories never fade.",paper:"fade",outro:true}
];
const audio=document.querySelector("#audio"),intro=document.querySelector("#intro"),lyric=document.querySelector("#lyric"),card=document.querySelector("#card"),v1=document.querySelector("#v1"),v2=document.querySelector("#v2"),heart=document.querySelector("#heart"),n1=document.querySelector("#n1"),n2=document.querySelector("#n2"),f1=document.querySelector("#f1"),f2=document.querySelector("#f2"),fill=document.querySelector("#fill"),clock=document.querySelector("#clock"),counter=document.querySelector("#counter");
const stamp=document.querySelector("#stamp"),scribble=document.querySelector("#scribble");
const dust=document.querySelector("#dust");
for(let i=0;i<24;i++){const p=document.createElement("i");p.style.setProperty("--x",(Math.random()*100)+"%");p.style.setProperty("--s",(1+Math.random()*3)+"px");p.style.setProperty("--d",(8+Math.random()*13)+"s");p.style.setProperty("--delay",(-Math.random()*18)+"s");p.style.setProperty("--drift",((Math.random()*80)-40)+"px");dust.appendChild(p)}
let started=false,last=-1;
function time(s){s=Math.floor(s||0);return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function show(i){if(i===last)return;last=i;const s=scenes[i]||scenes[0];lyric.classList.remove("show");lyric.innerHTML=s.text?(s.text+(s.outro?"<small>THE 1975 · ABOUT YOU</small>":"")):"";requestAnimationFrame(()=>lyric.classList.add("show"));card.classList.remove("right","zoom","fade");if(s.paper)card.classList.add(s.paper);v1.classList.toggle("show",s.vinyl===1||s.vinyl===2);v2.classList.toggle("show",s.vinyl===2);heart.classList.toggle("show",!!s.heart);stamp.classList.toggle("show",i>=1);scribble.classList.toggle("show",i>=2);n1.classList.toggle("show",s.note===1||s.note===2);n2.classList.toggle("show",s.note===2);f1.classList.toggle("show",!!s.flowers);f2.classList.toggle("show",!!s.flowers)}
function tick(){if(!started)return;const t=audio.currentTime||0,d=37;const i=scenes.reduce((a,s,j)=>t>=s.at?j:a,0);show(i);fill.style.width=Math.min(100,t/d*100)+"%";clock.textContent=time(t);counter.textContent=String(Math.min(37,Math.floor(t))).padStart(2,"0")+" / 37";if(t>=d||audio.ended){audio.pause();started=false;lyric.innerHTML="Some memories never fade.<small>THE 1975 · ABOUT YOU</small>";lyric.classList.add("show");card.classList.add("fade");return}requestAnimationFrame(tick)}
document.querySelector("#enter").addEventListener("click",async()=>{if(started)return;started=true;intro.classList.add("hide");try{await audio.play()}catch(e){started=false;intro.classList.remove("hide");alert("Audio belum bisa diputar. Pastikan song.mp3 berada di folder yang sama dengan index.html.");return}requestAnimationFrame(tick)});
audio.addEventListener("ended",()=>{started=false;lyric.innerHTML="Some memories never fade.<small>THE 1975 · ABOUT YOU</small>";lyric.classList.add("show");card.classList.add("fade")});
</script>
</body></html>
